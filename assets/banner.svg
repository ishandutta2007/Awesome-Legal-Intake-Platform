<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#311042;#1e1b4b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#0f172a;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="150" cy="150" r="120" fill="#0284c7" opacity="0.25" filter="url(#glow)">
    <animate attributeName="cx" values="150;250;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;80;150" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="150" r="140" fill="#a855f7" opacity="0.2" filter="url(#glow)">
    <animate attributeName="cx" values="1050;950;1050" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;220;150" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Legal & Workflow Decorative Elements -->
  <g transform="translate(80, 70)" stroke="url(#textGrad)" stroke-width="2" fill="none" opacity="0.6">
    <!-- Gavel / Scale Icon motif -->
    <path d="M20 40 L60 40 M40 20 L40 60 M20 60 L60 20">
      <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main Banner Text -->
  <text x="600" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
    Awesome Legal Intake Platform
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#e2e8f0" letter-spacing="0.5">
    ⚖️ Curated Legal Intake SaaS Ecosystem &amp; Open-Source Workflow Solutions 🚀
  </text>

  <!-- Decorative Pills / Tags -->
  <g transform="translate(340, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="34" rx="17" fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Matter Intake</text>

    <!-- Pill 2 -->
    <rect x="170" y="0" width="180" height="34" rx="17" fill="url(#accentGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="260" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#818cf8">Workflow Automation</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="150" height="34" rx="17" fill="url(#accentGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="445" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">Legal Operations</text>
  </g>
</svg>
